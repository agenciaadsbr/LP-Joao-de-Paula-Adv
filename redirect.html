<style>
  :root{
    --ink:#12151f;
    --navy:#232f4d;
    --navy-soft:#324063;
    --brass:#a9823d;
    --brass-light:#d3b072;
    --whats:#25d366;
    --whats-light:#3ee079;
    --muted-on-dark:#aab0c4;
    --line-on-dark:rgba(255,255,255,.14);
    --font-serif:'Newsreader', Georgia, serif;
    --font-sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:var(--font-sans);
    background:radial-gradient(ellipse at 30% 15%, #232f4d 0%, #12151f 62%);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    padding:28px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    max-width:440px; width:100%;
    text-align:center;
  }
  .logo{ width:150px; height:auto; margin:0 auto 36px; opacity:0; transform:translateY(10px); animation:rise .7s var(--ease) forwards; }
  .ring{
    position:relative;
    width:96px; height:96px; margin:0 auto 30px;
    opacity:0; transform:translateY(10px); animation:rise .7s var(--ease) .12s forwards;
  }
  .ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring circle{ fill:none; stroke-width:3; }
  .ring .track{ stroke:var(--line-on-dark); }
  .ring .bar{
    stroke:var(--whats);
    stroke-linecap:round;
    stroke-dasharray:264;
    stroke-dashoffset:264;
    animation:countdown 3s linear forwards;
  }
  .ring .num{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-serif); font-size:2rem; color:#fff;
  }
  @keyframes countdown{ to{ stroke-dashoffset:0; } }
  h1{
    font-family:var(--font-serif); font-weight:500; font-size:1.6rem;
    margin-bottom:14px;
    opacity:0; transform:translateY(10px); animation:rise .7s var(--ease) .24s forwards;
  }
  p{
    color:var(--muted-on-dark); font-size:1rem; line-height:1.55;
    max-width:38ch; margin:0 auto;
    opacity:0; transform:translateY(10px); animation:rise .7s var(--ease) .36s forwards;
  }
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    margin-top:30px;
    padding:14px 26px; border-radius:8px;
    background:var(--whats); color:#fff; text-decoration:none;
    font-size:.96rem; font-weight:600;
    transition:background .22s var(--ease), transform .22s var(--ease), box-shadow .22s var(--ease);
    opacity:0; transform:translateY(10px); animation:rise .7s var(--ease) .48s forwards;
  }
  .btn:hover{ background:var(--whats-light); transform:translateY(-2px); box-shadow:0 10px 24px rgba(37,211,102,.32); }
  .btn svg{ width:19px; height:19px; }
  @keyframes rise{ to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; opacity:1 !important; transform:none !important; }
  }
</style>
